<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#ececec" />
  <title>Portfolio — Nusa &amp; North</title>
  <link rel="icon" href="/brand/nusa-north-mark.svg" type="image/svg+xml" />
</head>
<body class="novara-portfolio-page">
  <a class="portfolio-skip" href="#portfolio">Skip to projects</a>
  <header class="portfolio-header">
    <a class="portfolio-brand" href="/novara.html" aria-label="Nusa & North — home"><img src="/brand/nusa-north-mark.svg" width="28" height="28" alt="" /><span>Nusa &amp; North</span></a>
    <a class="portfolio-back" href="/novara.html">Back to studio ↗</a>
  </header>
  <div class="portfolio-intro"><p>Films, campaigns &amp; stories</p><h1>The portfolio<span>.</span></h1></div>
  <div class="portfolio-toolbar">
    <p class="portfolio-hint">Drag to explore. Click or tap a film to view the project.</p>
    <div class="portfolio-switch" role="group" aria-label="Portfolio layout">
      <button type="button" data-portfolio-view="reel" aria-pressed="true"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="4" width="3" height="12" rx="1"/><rect x="7" y="4" width="6" height="12" rx="1"/><rect x="15" y="4" width="3" height="12" rx="1"/></svg>Reel</button>
      <button type="button" data-portfolio-view="grid" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3" width="6" height="6" rx="1"/><rect x="12" y="3" width="6" height="6" rx="1"/><rect x="2" y="12" width="6" height="6" rx="1"/><rect x="12" y="12" width="6" height="6" rx="1"/></svg>Grid</button>
    </div>
  </div>
  <p class="portfolio-status sr-only" role="status" aria-live="polite"></p>
  <main id="portfolio" aria-label="Full portfolio"></main>
  <footer class="portfolio-footer"><span>Nusa &amp; North / Films without borders</span><a href="/novara.html#contact">Let’s make something ↗</a><nav class="site-legal-links" aria-label="Legal"><a href="/novara-legal.html#privacy">Privacy</a><a href="/novara-legal.html#terms">Terms</a><a href="/novara-legal.html#business">Business details</a><button type="button" data-media-settings>Media settings</button></nav></footer>
  <noscript><p>Please enable JavaScript to browse the portfolio, or <a href="/novara.html">return to the studio</a>.</p></noscript>
  <script type="module" src="/src/novara-films-explore.js"></script>
</body>
</html>
